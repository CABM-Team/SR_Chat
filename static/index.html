<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SR_Chat</title>
    <link rel="icon" type="image/png" href="static/favicon.ico">
    <link rel="stylesheet" href="static/css/styles.css">
    <link rel="stylesheet" href="static/css/user_settings.css">
    <link rel="stylesheet" href="static/css/bubble_styles.css">
</head>
<body>
    <div id="app" class="container">
        <div class="two-col-layout">
            <aside class="two-col-layout__aside">
                <div class="user-header" id="userHeader">
                    <div class="user-header__avatar" id="userAvatarHeader">
                        <img id="userAvatarImg" alt="头像">
                    </div>
                    <div class="user-header__info">
                        <span class="user-header__name" id="userNameHeader">加载中...</span>
                    </div>
                    <button class="user-header__settings-btn" id="openSettingsBtn" title="设置">
                        ⚙️
                    </button>
                </div>
                <div class="search-box">
                    <input type="text" placeholder="搜索" class="search-input">
                </div>
                <div class="recent-contact-list" id="contactList">
                </div>
            </aside>
            
            <main class="two-col-layout__main">
                <div class="header-area">
                    <div class="corner-decoration">
                        <button class="back-btn" id="backToContactsBtn" title="返回联系人"><</button>
                    </div>
                    <div class="chat-header">
                        <h2 class="chat-header__contact-name" id="chatTitle">
                            <span>选择聊天对象</span>
                        </h2>
                        <div class="chat-header__toolbar bar-icon">
                            <button class="toolbar-btn" id="chatMenuBtn" title="菜单">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                                    <line x1="3" y1="6" x2="21" y2="6"></line>
                                    <line x1="3" y1="12" x2="21" y2="12"></line>
                                    <line x1="3" y1="18" x2="21" y2="18"></line>
                                </svg>
                            </button>
                            <div class="chat-menu-dropdown" id="chatMenuDropdown">
                                <div class="chat-menu-section">
                                    <label class="chat-menu-label">身份设定</label>
                                    <div class="chat-menu-identity-row">
                                        <input type="text" id="identityInput" class="chat-menu-input" placeholder="如：开拓者" maxlength="50">
                                        <button class="chat-menu-save-btn" id="saveIdentityBtn"> 保存 </button>
                                    </div>
                                </div>
                                <div class="chat-menu-divider"></div>
                                <button class="chat-menu-danger-btn" id="clearChatBtn">清空对话</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="chat-messages" id="chatMessages">
                    <div class="empty-state">
                        <p>选择一个聊天对象开始对话</p>
                    </div>
                </div>
                
                <div class="chat-input-area">
                    <div class="input-wrapper">
                        <textarea id="messageInput" placeholder="输入消息..." rows="3"></textarea>
                    </div>
                    <div class="send-btn-wrap">
                        <button class="send-msg" id="sendBtn">发送</button>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <div class="user-settings-modal" id="userSettingsModal">
        <div class="user-settings-content">
            <div class="settings-header">
                <h2>用户设置</h2>
                <button class="close-settings-btn" id="closeSettingsBtn">✕</button>
            </div>
            
            <div class="settings-section">
                <h3>头像</h3>
                <div class="avatar-setting">
                    <div class="avatar-preview" id="avatarPreview">
                        <img id="settingsAvatarImg" alt="头像">
                    </div>
                    <div class="avatar-actions">
                        <button class="btn btn-primary" id="changeAvatarBtn">更换头像</button>
                        <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                    </div>
                </div>
            </div>
            
            <div class="settings-section">
                <h3>聊天气泡（此功能存在问题，请选择默认）</h3>
                <div class="bubble-setting">
                    <div class="current-bubble" id="currentBubblePreview">
                        <span>当前气泡：</span>
                        <span id="currentBubbleName">默认</span>
                    </div>
                    <button class="btn btn-primary" id="changeBubbleBtn">选择气泡样式</button>
                </div>
            </div>
            
            <div class="settings-section">
                <h3>账号</h3>
                <button class="btn btn-danger" id="logoutBtn">退出登录</button>
            </div>
        </div>
    </div>
    
    <div class="bubble-selector-modal" id="bubbleSelectorModal">
        <div class="bubble-selector-content">
            <div class="bubble-selector-header">
                <h3>选择聊天气泡</h3>
                <button class="close-selector-btn" id="closeBubbleSelectorBtn">✕</button>
            </div>
            <div class="bubble-list" id="bubbleList">
            </div>
        </div>
    </div>
    
    <script src="static/js/chat_util.js"></script>
    <script src="static/js/user_settings.js"></script>
    <script src="static/js/bubble_selector.js"></script>
    <script src="static/js/chat.js"></script>
</body>
</html>
